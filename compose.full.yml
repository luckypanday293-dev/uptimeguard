services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: uptimeguard
      POSTGRES_USER: uptimeguard
      POSTGRES_PASSWORD: uptimeguard
    volumes:
      - uptimeguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptimeguard -d uptimeguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/uptimeguard
      DB_USERNAME: uptimeguard
      DB_PASSWORD: uptimeguard
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  uptimeguard_pgdata:
