spring.application.name=uptimeguard
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/uptimeguard}
spring.datasource.username=${DB_USERNAME:uptimeguard}
spring.datasource.password=${DB_PASSWORD:uptimeguard}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.monitor.scheduler-delay-ms=${MONITOR_SCHEDULER_DELAY_MS:15000}
app.monitor.default-timeout-ms=${MONITOR_DEFAULT_TIMEOUT_MS:3000}
app.monitor.default-retries=${MONITOR_DEFAULT_RETRIES:2}

logging.level.org.hibernate.SQL=INFO
